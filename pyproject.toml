[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-workbench"
version = "0.2.7"
description = "Ripple 本地优先内容工作台"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# 运行依赖统一安装，确保 Web、媒体处理和浏览器发布开箱可用。
dependencies = [
    "fastapi>=0.115,<1",        # Web 后端
    "uvicorn>=0.30,<1",         # ASGI server（Ripple Web）
    "sse-starlette>=2.1,<4",    # 对话流式 SSE
    "mcp>=1.28.1,<2",           # 本机 Agent 的 Streamable HTTP Tool Bridge；1.x 安全维护线
    "pydantic>=2.7,<3",         # 请求模型
    "segno>=1.6,<2",             # B站扫码登录二维码渲染（纯 Python）
    "python-multipart>=0.0.9,<1", # FastAPI 文件上传 / Form
    "Pillow>=10,<13", "opencv-python>=4.8,<5", "numpy>=1.26,<3",
    "pandas>=2,<4", "matplotlib>=3.8,<4", "librosa>=0.10,<1",
    "faster-whisper>=1,<2", "edge-tts>=6,<8", "playwright>=1.45,<2",
    "rembg>=2.0,<3", "biliup>=1,<2", "jieba>=0.42,<1", "snownlp>=0.12,<1",
    "markdown>=3.5,<4",
    "tzdata>=2025.2",
    "filelock>=3.20,<4", "httpx[socks]>=0.28,<1", "PyYAML>=6,<7", # HTTP(S)/SOCKS5 Provider proxy + IANA time zones
    "pycryptodome>=3.23,<4",       # POSIX machine-local AES-GCM secret store
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# 隐式水印深度清理：ControlNet/diffusion 运行时体积较大且要求 NVIDIA CUDA，因此不进入默认安装。
watermark = ["remove-ai-watermarks[diffusion]>=0.22,<0.23"]

[project.scripts]
ripple = "ripple.cli:main"

[tool.setuptools.packages.find]
include = ["ripple*"]

[tool.setuptools.package-data]
ripple = ["agent_adapters.json"]
